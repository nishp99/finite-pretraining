[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finite-pretraining"
version = "0.1.0"
description = "Finite-time linear autoencoder pretraining and downstream SFT/RL dynamics"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<2", "scipy>=1.14,<1.15", "jax==0.4.35", "matplotlib>=3.7", "threadpoolctl>=3"]

[project.optional-dependencies]
gpu = ["jax[cuda12]==0.4.35; platform_system == 'Linux'"]
test = ["pytest>=8"]
[project.scripts]
finite-pretraining = "finite_pretraining.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
markers = ["gpu: requires a CUDA device", "cold: full numerical recomputation"]
