name: CPU verification
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q -m 'not gpu'
